name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Same checks as a local run: format, analyze, sim tests, widget tests.
      - name: Run tool/ci.sh
        run: bash tool/ci.sh

  apk:
    name: Android APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      # Signed with the debug key (see app/android/app/build.gradle.kts):
      # installable on a phone, not uploadable to the Play Store.
      - uses: actions/upload-artifact@v4
        with:
          name: kitchen-chain-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------ Godot
  godot-parity:
    name: Godot sim matches the Dart sim
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Godot
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
        env:
          GODOT_VERSION: "4.5.1"
      - name: Import the project
        working-directory: game
        run: timeout 600 godot --headless --import || true
      # The same scripted games in both engines must give identical state, day by day.
      - name: Parity traces
        run: |
          cd packages/sim_core && dart pub get && cd ../..
          for cfg in "1 normal 0 30" "7 hard 4 30" "4 normal 2 40 chain"; do
            set -- $cfg
            (cd packages/sim_core && dart run tool/trace.dart $1 $2 $3 $4 $5 > /tmp/d.jsonl)
            (cd game && godot --headless -s res://tools/trace.gd -- $1 $2 $3 $4 /tmp/g.jsonl $5)
            python3 game/tools/compare.py /tmp/d.jsonl /tmp/g.jsonl
          done

  godot-apk:
    name: Godot Android APK (3D)
    needs: godot-parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.5.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Godot and export templates
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sL -o tpl.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q tpl.tpz -d /tmp/tpl && mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      - name: Android SDK and debug key
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $HOME/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.5.tres
      - name: Export APK
        working-directory: game
        run: |
          timeout 900 godot --headless --import || true
          mkdir -p build
          godot --headless --export-debug "Android" build/kitchen-chain.apk
          ls -la build
      # Debug-signed: installable on a phone, not uploadable to the Play Store.
      - uses: actions/upload-artifact@v4
        with:
          name: kitchen-chain-3d-apk
          path: game/build/kitchen-chain.apk
          if-no-files-found: error
          retention-days: 14
