name: kitchen_chain
description: Kitchen Chain — run a restaurant you bought, mess included. Offline, single player.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  sim_core:
    path: ../packages/sim_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
  # Bundled so the game looks the same offline on every phone (SIL OFL 1.1,
  # licence texts in assets/fonts/).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay-600.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-700.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-800.ttf
          weight: 800
